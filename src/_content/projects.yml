- title: Niépce's Camera Obscura
  slug: niepces-camera-obscura
  description: A 2008 replacement icon for Aperture and iPhoto, modeled after the camera obscura Nicéphore Niépce used for the first surviving photograph.
  content: |
    In 1826, Nicéphore Niépce used a camera obscura and a bitumen-coated plate to capture the world's first surviving photograph, _View from the Window at Le Gras_, the very image tucked inside Apple's iPhoto icon.

    In 2008, I turned Niépce's camera obscura into a custom replacement icon for Aperture and iPhoto.
  images:
    - file: niepces-camera-obscura-01.jpg
      alt: "Niépce's Camera Obscura wooden box icons with glass lenses beside a monochrome print of View from the Window at Le Gras."
    - file: niepces-camera-obscura-02.jpg
      alt: Stacked color-tinted prints of View from the Window at Le Gras beside a white cubic wooden camera obscura icon.
  links:
    - title: Info
      url: |
        https://kremalicious.com/niepces-camera-obscura-and-the-history-of-the-first-photograph
  techstack:
    - Photoshop
