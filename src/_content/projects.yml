- title: Ocean Market
  slug: oceanprotocol-market
  description: The flagship decentralized web app for Ocean Protocol v3, letting anyone publish, price, and monetize datasets. Product design and front-end engineering.
  content: |
    The flagship decentralized web app for Ocean Protocol v3, built so anyone could publish, price, and monetize datasets across EVM networks.

    In 2020, I led product design and front-end engineering for the app. Attaching Automated Market Maker pools to datatokens brought dynamic price discovery to data, while on-chain metadata and token-gated access (from direct downloads to Compute-to-Data) established a verifiable trail of provenance.

    Shipped open-source, it went on to serve as the blueprint for third-party data marketplaces built on Ocean Protocol.
  images:
    - file: oceanprotocol-market-01.png
      alt: Ocean Market multi-network switcher popover in light and dark modes with toggles for Ethereum, Polygon, BSC, and test networks.
    - file: oceanprotocol-market-02.png
      alt: Ocean Market dark-mode homepage with wave lines, bookmarked datasets, and a grid of highest-liquidity data pools.
    - file: oceanprotocol-market-03.png
      alt: Ocean Market dark-mode dataset page for an ocean chlorophyll satellite image with a Compute-to-Data algorithm selector and Buy Compute Job button.
    - file: oceanprotocol-market-04.png
      alt: Ocean Market liquidity pool card in dark and light themes with datatoken exchange rate, pool shares, TVL chart, and Add Liquidity button.
    - file: oceanprotocol-market-05.png
      alt: Ocean Market light-mode homepage with wave background, bookmarks list, and highest-liquidity dataset cards.
  links:
    - title: Ocean Makes Multi-Network Even Easier
      icon: FileText
      url: 'https://kremalicious.com/ocean-makes-multi-network-even-easier'
    - title: 'Ocean Market: An Open-Source Community Marketplace for Data'
      icon: FileText
      url: |
        https://blog.oceanprotocol.com/ocean-market-an-open-source-community-marketplace-for-data-4b99bedacdc3
