- title: Onde
  slug: onde
  description: Onde is a geographic data API for city and country search, created with alatus labs in 2026. I designed and built the API, website, and documentation.
  content: |
    While building [Lugara](/lugara/), we couldn't find a city dataset we actually trusted. So we built our own and opened it up to other developers as a public API.

