- title: Ocean Protocol - Commons
  slug: oceanprotocol-commons
  description: Commons was the open-data marketplace and public face of Ocean Protocol v1 and v2. I led its design and front-end engineering from 2018 to 2019.
  content: |
    Commons was the main public face of [Ocean Protocol](/oceanprotocol-v1/) v1 and v2: an open-data marketplace for browsing, downloading, and publishing datasets on the network.

    From 2018 to 2019, I led its design and front-end engineering. Beyond showcasing the full stack in production, Commons doubled as an open-source reference codebase for developers building their own Ocean dApps, before [Ocean Market](/oceanprotocol-market/) succeeded it in v3.
