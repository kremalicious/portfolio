- title: ezeep
  slug: ezeep
  description: From 2012 to 2015 I directed the brand and led product design and front-end engineering at ezeep, bringing emotional design to cloud printing.
  content: |
    Enterprise printing software is rarely pleasant to use. At ezeep from 2012 to 2015, I set out to change that by bringing consumer-grade craft and emotional design to cloud printing.

    I directed the brand and led product design and front-end engineering across every touchpoint, from user and market research to shipping apps for macOS, Windows, iOS, and Android.

    ezeep was acquired by [Cortado AG](https://www.cortado.com) in 2015 and became part of [ThinPrint Cloud Services](https://www.thinprintcloud.com).
