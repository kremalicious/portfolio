- title: Onde
  slug: onde
  description: A geographic data API for city and country search, built with alatus labs in 2026. I designed and built the API, website, and developer docs.
  content: |
    While building [Lugara](/lugara), we couldn't find a city dataset we actually trusted. So we built our own and opened it up to other developers as a public API.

    Created with alatus labs in 2026, Onde provides clean geographic data for city and country search. I designed and built the API, the website, and the developer documentation.
  images:
