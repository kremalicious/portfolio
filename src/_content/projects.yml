      alt: Onde dark world map drawn in topographic wave lines with orange coordinate pins for Reykjavík, New York, Lisbon, São Paulo, and Mumbai.
    - file: onde-02.png
      alt: Onde website homepage in light desktop and dark mobile views with topographic lines, city search headline, and Create a Free Key button.
    - file: onde-03.png
      alt: Onde interactive API playground in light and dark themes with autocomplete and reverse lookup requests for Kyoto in cURL and JSON.
    - file: onde-04.png
      alt: Onde annotated JSON response for Kyoto with callouts for city ID, localized names, ISO codes, coordinates, IANA time zone, and dataset metadata.
    - file: onde-05.png
      alt: Onde API reference page for the city autocomplete endpoint with query parameters on the left and a cURL request and JSON response on the right.
