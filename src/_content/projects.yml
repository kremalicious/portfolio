- title: Niépce's Camera Obscura
  slug: niepces-camera-obscura
  description: A 2008 replacement icon for Aperture and iPhoto, modeled after the camera obscura Nicéphore Niépce used for the first surviving photograph.
  content: |
    A 2008 replacement icon for Aperture and iPhoto, modeled after the camera obscura Nicéphore Niépce used in 1826 to capture the world's first surviving photograph.

    Using a bitumen-coated plate in a process he called heliography, Niépce produced _View from the Window at Le Gras_, the very photograph tucked inside the iPhoto icon itself.
  links:
    - title: Info
      url: |
        https://kremalicious.com/niepces-camera-obscura-and-the-history-of-the-first-photograph
  techstack:
    - Photoshop
