- title: Ocean Protocol - IPFS Integration
  slug: oceanprotocol-ipfs
  description: Integrating IPFS across the Ocean Protocol stack in 2019, with a public node, upload UI, and API so publishing datasets needed no CLI.
  content: |
    Decentralized storage tends to come with rough UX. In 2019, I integrated IPFS across the Ocean Protocol stack, from infrastructure and API to UI, so publishing a dataset wouldn't require running a node or touching a terminal.

    I built a public IPFS node with a focused upload interface and API, then wired it directly into the publish flow of [Commons](/oceanprotocol-commons) so files could be pinned and shared in one step.
  images:
    - file: oceanprotocol-ipfs-01.png
      alt: Dark Ocean Protocol IPFS gateway web interface with drag-and-drop file upload box, gateway URLs, and js-ipfs-http-client code example.
    - file: oceanprotocol-ipfs-02.png
      alt: Ocean Protocol Commons file input with a confirmed IPFS hash URL and an inline Add File To IPFS upload dropzone.
  links:
    - title: 'Ocean Protocol and IPFS, Sitting In The Merkle Tree'
      icon: FileText
      url: |
        https://kremalicious.com/ocean-protocol-and-ipfs-sitting-in-the-merkle-tree
    - title: '@oceanprotocol/ipfs'
      icon: GitHub
      url: 'https://github.com/oceanprotocol/ipfs'
  techstack:
