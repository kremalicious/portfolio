- title: ascribe
  slug: ascribe
  description: Years before NFTs went mainstream, ascribe registered ownership of art on the Bitcoin blockchain. I built UI for its websites and web app from 2015 to 2017.
  content: |
    Years before NFTs went mainstream, ascribe let artists register and transfer ownership of digital and physical works on the Bitcoin blockchain. Its approach helped inspire Ethereum's ERC-721 standard and eventually grew into [BigchainDB](/bigchaindb/).

    From 2015 to 2017, I built UI across ascribe's web touchpoints, including a main web app written in an early version of React, before the service was [discontinued in 2017](https://www.ascribe.io/).

    Branding and key visuals in collaboration with [Wojciech Hupert](https://twitter.com/wojciechhupert).
